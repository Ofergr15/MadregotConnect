# The daily release train. Production deploys the `production` branch (Vercel →
# Settings → Environments → Production → Branch Tracking).
#
# NOTHING goes out without the owner's approval. He approves a release in the
# app (/dashboard/whats-new); that pins the exact main commit he reviewed. At
# 05:00 Israel time this moves `production` to THAT commit — never to whatever
# main has become since. No approval, or an approval already shipped: nothing
# happens. See src/lib/release-notes.ts.
#
# The cron is UTC. 02:00 UTC is 05:00 in summer (IDT) and 04:00 in winter (IST).
name: Daily release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ship the approved commit
        run: |
          SHA=$(curl -fsS https://www.madregot.app/api/release/approved | jq -r '.sha // empty')
          if [ -z "$SHA" ]; then
            echo "No approved release — nothing goes out."
            exit 0
          fi
          git fetch origin production
          if [ "$SHA" = "$(git rev-parse origin/production)" ]; then
            echo "Approved commit $SHA is already live."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Approved commit $SHA is not on main — refusing."
            exit 1
          fi
          git push origin "$SHA:refs/heads/production" --force
          echo "production → $SHA"
