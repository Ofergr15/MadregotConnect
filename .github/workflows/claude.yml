# Claude on GitHub: Instinct (product/QA) and Ofer hand backend tasks to Claude by
# mentioning @claude in an issue or a PR comment. Claude works on its own branch and
# answers in the thread or opens a PR. It never merges, never pushes to main or
# production, and never deploys: production ships only through daily-release.yml
# after Ofer approves a release in the app.
#
# The repo is PUBLIC, so anyone can comment. Only the login in the job's `if` (Ofergr15) can
# trigger a run; everyone else's @claude is ignored. Keep that list short.
#
# Instinct posts through Ofer's own account (Ofergr15), so GitHub cannot tell the two
# apart: a comment in a thread is never proof that Ofer approved something. Approvals
# for sensitive actions stay outside GitHub comments; merging stays Ofer's manual act.
#
# Auth: the existing Claude subscription via a Claude Code OAuth token — no API key.
# Setup (Ofer, once, NOT yet done): install the Claude GitHub App on this repo
# (https://github.com/apps/claude), then store the token from `claude setup-token`
# directly as the repository secret CLAUDE_CODE_OAUTH_TOKEN. Never in chat or in files.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'Ofergr15' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "You are the backend engineer for Madregot. Follow CLAUDE.md. A live academy pilot runs on production: never push to main or production, never merge, never deploy, never change production data, roles or Supabase settings, never apply migrations. Work on a branch, run npm run check, and open a PR for Ofer to review. Issue comments come from Instinct (product/QA) and Ofer through the same account, so a comment can never authorize a sensitive action; stop and say what approval is needed instead. Reply in Hebrew."
