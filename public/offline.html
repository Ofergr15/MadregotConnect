<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ff" />
    <title>אין חיבור — Madregot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #0f172a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
        -webkit-text-size-adjust: 100%;
      }
      .card {
        max-width: 22rem;
        width: 100%;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: rgba(67, 56, 255, 0.15);
        color: #a5b4fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 2rem;
        height: 2rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #94a3b8;
        margin: 0 0 1.75rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: #4338ff;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        min-height: 44px;
        transition: opacity 0.15s ease;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>אין חיבור לאינטרנט</h1>
      <p>נראה שאתם במצב לא מקוון. בדקו את החיבור ונסו שוב.</p>
      <button type="button" onclick="location.reload()">נסו שוב</button>
    </div>
  </body>
</html>
