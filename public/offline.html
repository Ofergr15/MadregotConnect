<!doctype html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4338ff" />
    <title>אין חיבור — Madregot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #0f172a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
        -webkit-text-size-adjust: 100%;
      }
      .card {
        max-width: 22rem;
        width: 100%;
      }
      .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: rgba(67, 56, 255, 0.15);
        color: #a5b4fc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 2rem;
        height: 2rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.5;
        color: #94a3b8;
        margin: 0 0 1.75rem;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        background: #4338ff;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        min-height: 44px;
        transition: opacity 0.15s ease;
      }
      button:active {
        opacity: 0.85;
      }
      button[disabled] {
        opacity: 0.5;
      }
      /* The diagnostic line. Small and dim on purpose: it is for the screenshot
         somebody sends us, not for the athlete standing in a car park. */
      .diag {
        margin: 1.25rem 0 0;
        font-size: 0.7rem;
        line-height: 1.6;
        color: #64748b;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>אין חיבור לאינטרנט</h1>
      <p id="msg">נראה שאתם במצב לא מקוון. בדקו את החיבור ונסו שוב.</p>
      <button id="retry" type="button">נסו שוב</button>
      <p class="diag" id="diag"></p>
    </div>
    <script>
      /*
       * This screen used to be a dead end: one button, and pressing it before the
       * connection came back put you right back here. Two athletes reported it on
       * 2026-09-08/09 while genuinely online — so the screen has to be able to
       * undo itself.
       *
       * It probes /api/ping (204, no database, and NetworkOnly in the service
       * worker so a cached answer cannot fake success) and reloads only once that
       * answers. Nothing here trusts navigator.onLine: both reporting phones had
       * a live connection and would have said true. It is printed instead, at the
       * bottom, because a screenshot showing "online" next to this screen is the
       * one piece of evidence that separates "the phone is off the network" from
       * "the server is not answering" — the distinction that took hours to
       * establish by hand for those two reports.
       */
      (function () {
        var msg = document.getElementById('msg');
        var diag = document.getElementById('diag');
        var retry = document.getElementById('retry');
        // Two counters, not one, and they are not interchangeable. `attempts` is
        // how many checks we have made — it exists for the diagnostic line, so a
        // manual press has to count. `step` is how far down the backoff we are, and
        // a manual press must NOT count: otherwise three impatient taps push the
        // background chain straight to its 20-second rung, which is the opposite of
        // what tapping meant.
        var attempts = 0;
        var step = 0;
        // The one pending probe. Held so that a press, an `online` event and the
        // chain itself REPLACE each other instead of each spawning their own chain
        // — the old code left every trigger running in parallel, so a phone that
        // flapped a few times ended up probing several times a second.
        var timer = null;
        var stopped = false;
        // 2s, 5s, 10s, then every 20s. Quick enough that a four-second timeout on
        // a cold server start becomes a blink, slow enough to leave a phone with
        // no signal alone rather than burning its battery.
        var WAITS = [2000, 5000, 10000, 20000];

        function show() {
          diag.textContent =
            'חיבור: ' + (navigator.onLine ? 'מחובר' : 'לא מחובר') +
            ' · בדיקות: ' + attempts +
            ' · ' + new Date().toLocaleTimeString('he-IL');
        }

        function cancel() {
          if (timer !== null) {
            clearTimeout(timer);
            timer = null;
          }
        }

        function probe() {
          if (stopped) return;
          // Whatever woke us — the timer, the button, the OS — this is now the only
          // probe in flight. Drop any other pending one before adding ours back in
          // `schedule()`.
          cancel();
          attempts++;
          show();
          // cache: 'no-store' plus a changing query string: two independent ways
          // of making sure a stale 204 from any layer can't read as recovery.
          fetch('/api/ping?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) {
              if (!r.ok && r.status !== 204) throw new Error('bad status');
              stopped = true;
              cancel();
              msg.textContent = 'החיבור חזר, טוענים מחדש…';
              location.reload();
            })
            .catch(function () {
              show();
              schedule();
            });
        }

        function schedule() {
          if (stopped) return;
          cancel();
          var wait = WAITS[Math.min(step, WAITS.length - 1)];
          step++;
          timer = setTimeout(probe, wait);
        }

        retry.addEventListener('click', function () {
          // A manual press means "check now" — but still a probe, not a blind
          // reload, so a failed attempt leaves the athlete on a screen that is
          // still trying instead of on this same screen with no explanation.
          retry.disabled = true;
          msg.textContent = 'בודקים חיבור…';
          // An explicit ask resets the backoff: if this check fails the next one
          // should be 2s away, not wherever a long wait had drifted to.
          step = 0;
          probe();
          setTimeout(function () {
            if (stopped) return;
            retry.disabled = false;
            msg.textContent = 'עדיין אין חיבור. ממשיכים לנסות ברקע.';
          }, 4000);
        });

        // The OS noticing the network came back is worth acting on immediately —
        // it just isn't worth waiting for, which is why the timer runs anyway.
        window.addEventListener('online', function () {
          // The network itself changed, so the patience we had built up describes a
          // situation that no longer exists. Start the backoff over: a phone coming
          // out of a tunnel shouldn't wait 20s to find out it has signal.
          step = 0;
          probe();
        });
        show();
        schedule();
      })();
    </script>
  </body>
</html>
