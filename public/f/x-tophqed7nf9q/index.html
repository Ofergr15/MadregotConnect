<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מדרגות · יכולות חדשות</title><style>
*{box-sizing:border-box}body{margin:0;background:#0B0D2E;color:#fff;font-family:-apple-system,"SF Hebrew",Heebo,system-ui,sans-serif}
header{padding:28px 32px 0;display:flex;align-items:center;gap:18px}header img{height:34px}header h1{margin:0;font-size:24px;font-weight:800;color:#C9CCF5}
.tabs{display:flex;gap:8px;padding:22px 32px 0;overflow-x:auto;border-bottom:1px solid #ffffff1a}
.tab{display:flex;gap:8px;align-items:center;background:none;border:0;color:#9DA2D8;font:inherit;font-size:17px;font-weight:800;padding:12px 18px;border-radius:14px 14px 0 0;cursor:pointer;white-space:nowrap}
.tab.on{background:#1a1d4a;color:#fff;box-shadow:inset 0 -3px 0 #FF5A1F}
.panel{display:none;padding:28px 32px 60px}.panel.on{display:block}
.head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}.head h2{margin:0;font-size:34px}.head p{margin:8px 0 4px;max-width:720px;color:#C9CCF5;line-height:1.6;font-size:16px}.head small{color:#7f84b8}
.dl{display:flex;gap:10px}.dl a{background:#fff;color:#0B0D2E;text-decoration:none;font-weight:800;padding:11px 16px;border-radius:12px;font-size:14px}.dl a+a{background:#ffffff1a;color:#fff}
.body{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:28px;margin-top:24px;align-items:start}
.vid video{width:100%;border-radius:22px;background:#000;box-shadow:0 30px 60px -20px #000}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.gal figure{margin:0;cursor:zoom-in}.gal img{width:100%;border-radius:14px;display:block;box-shadow:0 10px 24px -10px #000}
.gal figcaption{margin-top:6px;font-size:12.5px;color:#C9CCF5;line-height:1.35}
.lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}.lb.on{display:flex}.lb img{max-height:92vh;max-width:92vw;border-radius:18px}
.lb .x{position:absolute;top:18px;left:22px;font-size:30px;color:#fff;cursor:pointer}.lb .nav{position:absolute;top:50%;font-size:46px;color:#fff;cursor:pointer;padding:20px;user-select:none}.lb .prev{right:10px}.lb .next{left:10px}
@media (max-width:760px){.body{grid-template-columns:1fr}.head h2{font-size:26px}}
</style></head><body>
